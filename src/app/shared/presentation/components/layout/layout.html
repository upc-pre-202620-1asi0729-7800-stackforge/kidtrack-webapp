<kt-toast-container/>

@if (hideNav()) {
  <!-- Auth pages: full screen without sidebar -->
  <router-outlet/>
} @else {
  <!-- App layout -->
  <div class="app-layout">

    <!-- ── Mobile top bar ──────────────────────────────────── -->
    <header class="mobile-topbar">
      <button class="burger-btn" (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()">
        <span class="burger-line" [class.open]="menuOpen()"></span>
        <span class="burger-line" [class.open]="menuOpen()"></span>
        <span class="burger-line" [class.open]="menuOpen()"></span>
      </button>
      <div class="topbar-logo">
        <kt-logo [size]="26" [onDark]="true"/>
      </div>
      <div class="topbar-right">
        <kt-language-switcher/>
      </div>
    </header>

    <!-- ── Backdrop (mobile) ───────────────────────────────── -->
    <div class="sidebar-backdrop" [class.visible]="menuOpen()" (click)="menuOpen.set(false)"></div>

    <!-- ── Sidebar ─────────────────────────────────────────── -->
    <aside class="sidebar" [class.sidebar-open]="menuOpen()">
      <div class="sidebar-logo">
        <kt-logo class="sidebar-logo-mark" [size]="30" [onDark]="true"/>
        <!-- Close button (mobile) -->
        <button class="sidebar-close-btn" (click)="menuOpen.set(false)">
          <i class="pi pi-times"></i>
        </button>
      </div>

      <kt-nav-bar class="sidebar-nav-host"/>

      <div class="sidebar-footer">
        <div class="language-row">
          <kt-language-switcher/>
        </div>
        <div class="user-info">
          <div class="user-avatar">
            <i class="pi pi-user"></i>
          </div>
          <div class="user-details">
            <span class="user-name">{{ iamStore.currentUser()?.firstName }} {{ iamStore.currentUser()?.lastName }}</span>
            <span class="user-role">{{ roleLabel() }}</span>
          </div>
        </div>
        <button class="sign-out-btn" (click)="onSignOut()">
          <i class="pi pi-sign-out"></i>
          <span>{{ 'option.sign-out' | t }}</span>
        </button>
      </div>
    </aside>

    <!-- ── Main content ────────────────────────────────────── -->
    <main class="main-area">
      <router-outlet/>
    </main>

  </div>
}
